<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff2f7">
<title>BUBO.exe — Guglu Protocol</title>
<style>
:root{--ink:#442b43;--muted:#806b80;--pink:#ff7eb6;--lav:#e7ddff;--cream:#fffaf2;--line:#f0dce9;--gold:#fff3c4}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:ui-rounded,"Trebuchet MS",system-ui,sans-serif;background:radial-gradient(circle at 10% 5%,#ffe0ee,transparent 30%),radial-gradient(circle at 90% 25%,#e9e2ff,transparent 28%),var(--cream)}
.wrap{width:min(760px,100%);margin:auto;padding:20px 14px 40px}.top{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:18px}.logo{font-weight:900;letter-spacing:.08em;background:#fff9;padding:10px 13px;border:1px solid var(--line);border-radius:99px}.tiny,.muted{color:var(--muted)}.tiny{font-size:.76rem}.progress{height:7px;background:#f4e3ed;border-radius:99px;overflow:hidden;margin-bottom:18px}.bar{height:100%;width:0;background:linear-gradient(90deg,var(--pink),#b6a1ff);transition:width .3s}.card{background:#ffffffdf;border:1px solid var(--line);border-radius:26px;padding:clamp(22px,5vw,40px);box-shadow:0 16px 45px #6b3f601f;position:relative;overflow:hidden}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-size:.72rem;font-weight:900;color:#ba6492;margin:0 0 12px}h1,h2{line-height:1.08;letter-spacing:-.04em;margin:0 0 15px}h1{font-size:clamp(2.3rem,8vw,4.4rem)}h2{font-size:clamp(1.8rem,6vw,3rem)}p{font-size:1.03rem;line-height:1.7;margin:0 0 15px}.sticker{display:inline-block;background:var(--lav);padding:9px 13px;border-radius:14px;transform:rotate(-2deg);font-weight:800;margin:4px 0 20px}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.btn{border:0;border-radius:15px;padding:13px 18px;font-weight:850;cursor:pointer}.primary{background:var(--pink);color:white;box-shadow:0 6px 0 #e85f9b}.secondary{background:white;border:1px solid var(--line);color:var(--ink)}.soft{background:var(--lav);color:var(--ink)}.choices{display:grid;gap:10px;margin:20px 0}.choice{border:1.5px solid var(--line);border-radius:16px;background:white;padding:15px;text-align:left;color:var(--ink);font-weight:750;cursor:pointer}.choice.selected{border-color:#df6da6;background:#fff0f7;box-shadow:0 0 0 3px #ffdfed}.feedback{min-height:28px;color:#a34f82;font-weight:800;margin-top:8px}.note{background:#fff8dc;border:1px dashed #e7c56e;padding:15px 17px;border-radius:16px;margin:15px 0}.pillrow{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.pill{background:#f5edff;border-radius:999px;padding:8px 11px;font-size:.88rem;font-weight:800}.letter{background:#fffaf4;border:1px solid #f3e2d2;border-radius:18px;padding:20px;white-space:pre-line;line-height:1.8}.bigheart{font-size:3.4rem;display:block;margin:8px 0 15px;animation:beat 1.3s infinite}.small-input{width:100%;padding:14px;border:1.5px solid var(--line);border-radius:14px;background:white;color:var(--ink);margin:8px 0}.footer{text-align:center;color:var(--muted);font-size:.78rem;padding:18px}.clue{font-size:1.15rem;letter-spacing:.1em;text-align:center;background:#fff8dc;padding:18px;border-radius:16px;font-weight:900;margin:18px 0}.success{color:#4e865c;font-weight:850}
.memory-card{background:linear-gradient(135deg,#fff1f8,#f2edff);border:1px solid #f1d8e9;border-radius:22px;padding:20px;margin:18px 0;text-align:center;animation:appear .8s ease both}
.time-stamp{display:inline-block;border-radius:999px;background:#fff;padding:8px 13px;font-weight:900;color:#b55d91;letter-spacing:.08em}
.memory-date{font-size:clamp(2rem,8vw,3.2rem);font-weight:950;letter-spacing:-.05em;margin:12px 0 4px}
.reveal-wrap{position:relative;text-align:center;padding-top:6px}
.reveal-question{animation:rise 1s cubic-bezier(.2,.8,.2,1) both}
.float-heart{position:absolute;pointer-events:none;opacity:0;animation:floatup 3s ease-in infinite}
.float-heart:nth-child(1){left:10%;animation-delay:.1s}.float-heart:nth-child(2){left:82%;animation-delay:.8s}.float-heart:nth-child(3){left:28%;animation-delay:1.5s}.float-heart:nth-child(4){left:70%;animation-delay:2.1s}
@keyframes appear{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes rise{from{opacity:0;transform:translateY(20px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes floatup{0%{opacity:0;transform:translateY(40px) rotate(-10deg)}20%{opacity:.8}100%{opacity:0;transform:translateY(-170px) rotate(20deg)}}
@keyframes beat{50%{transform:scale(1.1)}}@media(max-width:480px){.top{align-items:flex-start}.btn{width:100%}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div class="logo">♡ BUBO.exe</div><div class="tiny">GUGLU PROTOCOL · build 14.10.23</div></div>
<div class="progress"><div class="bar" id="bar"></div></div>
<main class="card" id="app" aria-live="polite"></main>
<div class="footer">handmade with affection · no pressure, just a question ♡</div></div>
<script>
const app=document.getElementById('app'),bar=document.getElementById('bar');let step=0,secretUnlocked=false,finalAnswer=false;
function go(){step++;render()}
function choose(el,msg){document.querySelectorAll('.choice').forEach(x=>x.classList.remove('selected'));el.classList.add('selected');const f=document.getElementById('feedback');if(f)f.textContent=msg}
function render(){bar.style.width=Math.min(100,step/8*100)+'%';
const pages=[
`<p class="eyebrow">Official notice · please do not panic</p><div class="sticker">Diana's very important mission</div><h1>Hi, bubo.<br>Guglu needs you.</h1><p>Our extremely serious research department has detected one (1) very cute person who has not yet completed the required paperwork.</p><p class="muted">Estimated time: a few minutes. Required qualifications: being Diana. That's literally it.</p><div class="pillrow"><span class="pill">🧸 tiny silliness</span><span class="pill">💌 classified feelings</span><span class="pill">🏏 one memory to unlock</span></div><div class="actions"><button class="btn primary" onclick="go()">Start the very serious mission →</button><button class="btn secondary" onclick="alert('Suspicious? Yes. Dangerous? Only to your ability to stop smiling. ♡')">Is guglu legally allowed to do this?</button></div>`,
`<p class="eyebrow">Part 01 · identity verification</p><h2>Who is the main character?</h2><p>Please answer honestly. The committee is watching. (The committee is one emotionally invested person.)</p><div class="choices"><button class="choice" onclick="choose(this,'Correct. The entire budget has been spent on making you smile. ♡')">A. Diana, obviously</button><button class="choice" onclick="choose(this,'Incorrect. Please report to the Bubo Appreciation Department.')">B. A cricket umpire</button><button class="choice" onclick="choose(this,'A cute potato may be involved, but it is not the lead.')">C. A suspiciously cute potato</button></div><div id="feedback" class="feedback"></div><div class="actions"><button class="btn primary" onclick="go()">Submit answer with confidence →</button></div>`,
`<p class="eyebrow">Part 02 · relationship science</p><h2>A very important hypothetical.</h2><p>If someone you care about has had a rough day, what matters most?</p><div class="choices"><button class="choice" onclick="choose(this,'Correct. Listen first, understand, and ask what would help. ♡')">A. Listen and show up in the way they need</button><button class="choice" onclick="choose(this,'Good intentions matter, but listening comes before launching a rescue mission.')">B. Fix the whole universe immediately</button><button class="choice" onclick="choose(this,'The committee recommends not treating feelings like a Wi-Fi issue.')">C. Turn feelings off and on again</button></div><div id="feedback" class="feedback"></div><div class="note">A tiny reminder from guglu: love should leave room for honesty, boundaries, and both people being themselves.</div><div class="actions"><button class="btn primary" onclick="go()">I have learned important science →</button></div>`,
`<p class="eyebrow">Part 03 · classified memory file</p><h2>Operation: 14 October 2023</h2><p>There is a day tucked away in this little story: <strong>India vs Pakistan, 14 October 2023.</strong></p><p>But this file isn't really about cricket. It's about the first time we video-called — and the day I finally asked you out for the first time.</p><p>To open the next file, solve this tiny date puzzle.</p><div class="clue">14 · 10 · 23</div><p class="muted">Enter the date as six digits, DDMMYY. No cricket knowledge test, no pressure. Just a little key.</p><input class="small-input" id="datecode" inputmode="numeric" maxlength="6" placeholder="DDMMYY"><div id="feedback" class="feedback"></div><div class="actions"><button class="btn primary" onclick="unlockDate()">Unlock memory →</button><button class="btn secondary" onclick="skipDate()">I need a hint</button></div>`,
`<p class="eyebrow">Memory unlocked · match day</p><span class="bigheart">🏏</span><div class="memory-card"><span class="time-stamp">THE MEMORY FILE</span><div class="memory-date">14.10.2023</div><div>India 🇮🇳 vs Pakistan 🇵🇰 · our first video call</div><div class="clue">18:51 <span style="font-size:.85rem;letter-spacing:0">— the time I asked you out</span></div></div><h2>It was the match… but it was also us.</h2><p>We were on our first video call, talking, having fun, and watching the India vs Pakistan match. And at <strong>18:51</strong>, I finally asked you out for the first time.</p><p>It’s funny how one day can hold a whole match and a memory that means something different to two people. I wanted to keep this little piece of our story here — just for you.</p><div class="note">From guglu: This is the date I wanted you to rediscover before I ask you something again, properly, in my own little way. ♡</div><div class="actions"><button class="btn primary" onclick="go()">Continue, bubo →</button></div>`,
`<p class="eyebrow">Part 04 · guglu appreciation department</p><h2>Official findings.</h2><p>After a totally unbiased review, the department has reached the following conclusions:</p><div class="note">♡ You can make ordinary moments feel special.</div><div class="note">♡ The little details about you matter — not just the big things.</div><div class="note">♡ You deserve to be heard, understood, and treated with care.</div><div class="note">♡ Making you smile is an excellent use of a browser.</div><p class="muted">The department would like to file a formal complaint that one paragraph is not enough to explain all this.</p><div class="actions"><button class="btn primary" onclick="go()">Read the next extremely official document →</button></div>`,
`<p class="eyebrow">Part 05 · possible future forecast</p><h2>Potential activities, subject to mutual approval.</h2><p>The future is not a contract. But if we both want it, it could hold little things like:</p><div class="choices"><button class="choice" onclick="this.classList.toggle('selected')">♡ More memories that become inside jokes</button><button class="choice" onclick="this.classList.toggle('selected')">♡ Laughing at things nobody else understands</button><button class="choice" onclick="this.classList.toggle('selected')">♡ Honest conversations, even when they're difficult</button><button class="choice" onclick="this.classList.toggle('selected')">♡ Growing and learning together</button><button class="choice" onclick="this.classList.toggle('selected')">♡ Snacks, affection, and a suspicious amount of cuteness</button></div><p class="muted">Select whichever sound nice. This is a wishlist, not a binding agreement.</p><div class="actions"><button class="btn primary" onclick="go()">Okay, show me the last puzzle →</button></div>`,
`<p class="eyebrow">Final puzzle · guglu's last brain cell</p><h2>One last little code.</h2><p>You've seen the date that unlocked a memory. Now solve this word puzzle to reveal what this whole mission has been building toward.</p><div class="clue">B U B O  +  G I R L F R I E N D</div><p>Fill in the missing word in the sentence:</p><p><strong>“Bubo, will you be ma ______?”</strong></p><input class="small-input" id="lastword" placeholder="Type the missing word…" maxlength="20"><div id="feedback" class="feedback"></div><div class="actions"><button class="btn primary" onclick="unlockFinal()">Unlock the final question ♡</button><button class="btn secondary" onclick="finalHint()">I need a hint</button></div>`,
`<p class="eyebrow">Application complete · no tricks, promise</p><div class="reveal-wrap"><span class="float-heart">♡</span><span class="float-heart">✦</span><span class="float-heart">💗</span><span class="float-heart">♡</span><div class="memory-card"><span class="time-stamp">ONE LAST MEMORY</span><div class="memory-date">18:51</div><div>14 October 2023 · the first time I asked you out</div></div><span class="bigheart">💌</span><div class="reveal-question"><h1>Diana Rao…</h1><h2>Will you become my girlfriend and make me the happiest man on the planet? ♡</h2></div></div><div class="letter">I made this little place for you because I wanted to do something that feels like us — something cute, a little silly, and personal enough that it couldn't belong to anyone else.

On 14 October 2023, while India vs Pakistan was happening, we had our first video call — and I finally asked you out for the first time. That date means something to me because it holds the beginning of a memory that's ours. I wanted to bring you back to it before asking you this again.

You mean a lot to me, Diana. I want to keep making memories with you, and I want to show care through the ordinary things too: listening, being consistent, respecting each other, and learning as we go.

So after all the official paperwork, the cricket-related investigation, and this very pink website, here's the actual question.

Diana Rao… will you become my girlfriend and make me the happiest man on the planet? ♡</div><p class="muted">Take your time. I want your honest answer, and there's no pressure to reply a certain way.</p><div class="actions"><button class="btn primary" onclick="finalMsg('🥹 I am smiling at my screen like an idiot. Thank you for choosing this with me. Let’s take it one day at a time. ♡')">YES, YOU GUGLU ♡</button><button class="btn soft" onclick="finalMsg('Hug request received. Sending the softest virtual hug. 🫂 Take your time, bubo. ♡')">I need a hug first 🧸</button><button class="btn secondary" onclick="finalMsg('Of course. Take all the time you need. No pressure, no guilt — thank you for being honest with me. ♡')">I need a little time</button></div><div id="finalfeedback" class="feedback"></div>`
];app.innerHTML=pages[Math.min(step,pages.length-1)];}
function unlockDate(){let v=(document.getElementById('datecode').value||'').replace(/\D/g,'');const f=document.getElementById('feedback');if(v==='141023'){f.textContent='Correct! Memory file unlocked. ♡';setTimeout(go,750)}else{f.textContent='Not quite — try 14 October 2023 as DDMMYY. You can do this, bubo!';}}
function skipDate(){document.getElementById('feedback').textContent='Hint: day = 14, month = 10, year = 23. Put them together as DDMMYY. ♡';}
function unlockFinal(){const v=(document.getElementById('lastword').value||'').trim().toLowerCase();const f=document.getElementById('feedback');if(['girlfriend','girl friend'].includes(v)){f.textContent='Puzzle solved. The final file is opening… ♡';setTimeout(go,900)}else{f.textContent='Almost! The missing word is what you hope she’ll be: girlfriend. ♡';}}
function finalHint(){document.getElementById('feedback').textContent='Hint: G I R L F R I E N D. You’ve got this. ♡';}
function finalMsg(msg){document.getElementById('finalfeedback').textContent=msg}
render();
</script></body></html>
